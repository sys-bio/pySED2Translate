[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pysed2translate-pbg"
version = "0.1.0"
description = "Translate SED2 simulation experiment documents into Process Bigraph composite documents (a second target of pysed2translate)."
readme = "README.md"
requires-python = ">=3.13"
# The host (pysed2translate) and libsed2 are installed separately, as for the host itself (see the host README).
dependencies = [
    "process-bigraph==1.8.5",
    "bigraph-schema==1.7.0",
]

[project.optional-dependencies]
viva = ["viva-tellurium==0.1.2", "viva-copasi==0.1.2"]
dev = ["pytest>=8"]

[project.scripts]
pysed2translate-pbg = "pysed2translate_pbg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
